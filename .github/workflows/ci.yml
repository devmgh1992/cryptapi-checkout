name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint every PHP file
        run: |
          find src config database routes stubs tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l resources/views/checkout.blade.php

  tests:
    name: PHPUnit (Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, mbstring, json
          coverage: none

      - name: Pin the test harness
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run the suite
        run: vendor/bin/phpunit --testdox
